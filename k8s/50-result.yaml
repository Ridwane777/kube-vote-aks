apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: bernstein
spec:
  type: LoadBalancer
  # The original result client uses Socket.IO HTTP long-polling: a session only
  # exists on the pod that created it, so a client must always reach the same
  # pod. Local keeps the real client IP (no SNAT) so ClientIP affinity works.
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  selector:
    app: result
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: bernstein
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      # Spread replicas over nodes so losing one node does not take the app down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: result
      terminationGracePeriodSeconds: 40
      containers:
        - name: result
          image: ${REGISTRY}/result:${TAG}
          ports:
            - containerPort: 80
          # Keep serving while the load balancer and kube-proxy stop routing
          # to this pod, otherwise in-flight requests fail during a rollout.
          # Longer than poll: with externalTrafficPolicy Local the Azure load
          # balancer must first see the node's health check fail.
          lifecycle:
            preStop:
              sleep:
                seconds: 20
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
