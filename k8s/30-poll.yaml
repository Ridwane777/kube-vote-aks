apiVersion: v1
kind: Service
metadata:
  name: poll
  namespace: bernstein
spec:
  type: LoadBalancer
  selector:
    app: poll
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  namespace: bernstein
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: poll
  template:
    metadata:
      labels:
        app: poll
    spec:
      # Spread replicas over nodes so losing one node does not take the app down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: poll
      containers:
        - name: poll
          image: ${REGISTRY}/poll:${TAG}
          # The image default is a single sync worker: one idle client
          # connection blocks it and the probes time out.
          command: ["gunicorn", "--bind", "0.0.0.0:80", "--worker-class", "gthread",
                    "--workers", "2", "--threads", "4", "wsgi:app"]
          ports:
            - containerPort: 80
          # Keep serving while the load balancer and kube-proxy stop routing
          # to this pod, otherwise in-flight requests fail during a rollout.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          env:
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
